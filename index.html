<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>online-store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>online-store</h1>
        <div class="filters">
        <input type="text" id="search-input" placeholder="find by name...">
        <select id="category-select">
          <option value="">all categories</option>
        </select>
    </div>
   <select id="sort-select">
    <option value="">Default sorting</option>
    <option value="price-asc">Price: Low to High</option>
    <option value="price-desc">Price: High to Low</option>
    <option value="rating">Best Rating</option>
  </select>

    </header>
    <main>
    <div class="main-layout">
    <div class="products-section">
        <div id="shop-container"></div>
        <div id="pagination-container"></div>
   </div>
    <div class="cart-sidebar">
        <h3>your cart</h3>
        <div id="cart-container">
          
        </div>
        <div id="cart-total" style="margin: 15px 0; font-weight: bold;">
            total: $0.00
        </div>

    
        <form id="checkout-form">
            <h4>Order!!!</h4>
            <input type="text" id="fullname" placeholder="name and surname " required style="width: 100%; margin-bottom: 10px;">
            <input type="text" id="phone" placeholder="phone" required style="width: 100%; margin-bottom: 10px;">
            <input type="text" id="address" placeholder="adress" required style="width: 100%; margin-bottom: 10px;">
            <button type="submit" id="checkout-btn" style="width: 100%;">order</button>
        </form>
    </div>
</div>

    </main>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/storage.js"></script>
</body>
</html>
